<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 50%, #fbc2eb 100%);
      color: #2d3436;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 48px 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
      animation: fadeUp 0.7s ease both;
    }
    .wave {
      display: inline-block;
      font-size: 3.5rem;
      transform-origin: 70% 70%;
      animation: wave 2s ease-in-out infinite;
    }
    h1 {
      margin: 16px 0 8px;
      font-size: 2.2rem;
    }
    .greeting {
      margin: 0 0 8px;
      font-size: 1.1rem;
      color: #636e72;
    }
    .message {
      min-height: 1.6em;
      margin: 0 0 28px;
      font-size: 1rem;
      color: #636e72;
    }
    button {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: #6c8cff;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    button:hover {
      background: #5877f0;
      transform: translateY(-2px);
    }
    button:active {
      transform: translateY(0);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      10%, 30% { transform: rotate(14deg); }
      20% { transform: rotate(-8deg); }
      40% { transform: rotate(-4deg); }
      50% { transform: rotate(10deg); }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="wave">👋</div>
    <h1>Hello, World!</h1>
    <p class="greeting" id="greeting"></p>
    <p class="message" id="message">첫 번째 웹페이지를 만나 주셔서 반갑습니다.</p>
    <button id="btn">인사 받기</button>
  </main>

  <script>
    var hour = new Date().getHours();
    var greeting = "안녕하세요!";
    if (hour < 12) greeting = "좋은 아침입니다!";
    else if (hour < 18) greeting = "좋은 오후입니다!";
    else greeting = "좋은 저녁입니다!";
    document.getElementById("greeting").textContent = greeting;

    var messages = [
      "오늘도 한 걸음씩 만들어 가고 계시네요.",
      "작게 시작해도 충분히 멋진 출발입니다.",
      "버튼을 눌러 주셔서 감사합니다!",
      "코드는 쓰는 만큼 익숙해집니다."
    ];
    var index = 0;
    document.getElementById("btn").addEventListener("click", function () {
      document.getElementById("message").textContent = messages[index];
      index = (index + 1) % messages.length;
    });
  </script>
</body>
</html>
